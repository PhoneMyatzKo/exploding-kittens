<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14121c">
<title>Exploding Kittens</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💥</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ───────────────────────────── home ───────────────────────────── -->
<section id="home" class="screen">
  <div class="panel">
    <h1 class="logo">💥 Exploding<br>Kittens</h1>
    <p class="tagline">A party game for 2–5 people, one phone each.</p>

    <label class="field">
      <span>Your name</span>
      <input id="name-input" maxlength="16" autocomplete="nickname" placeholder="Alex">
    </label>

    <button id="create-btn" class="btn primary big">Create a room</button>

    <div class="or"><span>or join one</span></div>

    <form id="join-form" class="join-row">
      <input id="code-input" class="code-input" maxlength="6" autocapitalize="characters"
             autocomplete="off" spellcheck="false" placeholder="CODE">
      <button class="btn" type="submit">Join</button>
    </form>

    <p id="home-error" class="error" hidden></p>
  </div>
</section>

<!-- ───────────────────────────── lobby ───────────────────────────── -->
<section id="lobby" class="screen" hidden>
  <div class="panel">
    <p class="muted">Room code</p>
    <p id="lobby-code" class="room-code"></p>
    <button id="copy-link" class="btn ghost small">Copy invite link</button>

    <ul id="lobby-players" class="lobby-players"></ul>

    <p id="lobby-hint" class="muted"></p>
    <button id="start-btn" class="btn primary big" hidden>Deal the cards</button>
  </div>
</section>

<!-- ───────────────────────────── table ───────────────────────────── -->
<section id="table" class="screen table" hidden>
  <header class="topbar">
    <span id="table-code" class="pill"></span>
    <span id="turn-banner" class="turn-banner"></span>
    <button id="log-toggle" class="btn ghost small">Log</button>
  </header>

  <div id="seats" class="seats"></div>

  <div class="center">
    <button id="deck" class="deck" type="button">
      <span class="deck-label">Draw</span>
      <span id="deck-count" class="deck-count"></span>
    </button>
    <div id="discard" class="discard"></div>
  </div>

  <div id="target-row" class="target-row" hidden>
    <span class="target-label">Play on whom?</span>
    <div id="target-buttons" class="target-buttons"></div>
    <button id="target-cancel" class="btn ghost small">Cancel</button>
  </div>

  <footer class="handbar">
    <div id="hand" class="hand"></div>
    <div class="actions">
      <button id="play-btn" class="btn primary" disabled>Play</button>
      <span id="hint" class="hint"></span>
    </div>
  </footer>

  <aside id="log-panel" class="log-panel" hidden>
    <div class="log-head">
      <strong>Play by play</strong>
      <button id="log-close" class="btn ghost small">Close</button>
    </div>
    <ol id="log" class="log"></ol>
  </aside>
</section>

<!-- ───────────────────────── nope window ───────────────────────── -->
<div id="nope-bar" class="nope-bar" hidden>
  <div class="nope-inner">
    <p id="nope-text" class="nope-text"></p>
    <div class="nope-timer"><i id="nope-fill"></i></div>
    <div class="nope-actions">
      <button id="nope-btn" class="btn nope" hidden>NOPE!</button>
      <button id="pass-btn" class="btn ghost" hidden>Let it happen</button>
    </div>
  </div>
</div>

<!-- ───────────────────────────── modals ───────────────────────────── -->
<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <h2 id="modal-title"></h2>
    <p id="modal-body" class="muted"></p>
    <div id="modal-cards" class="modal-cards"></div>
    <div id="modal-place" class="place" hidden>
      <div class="place-quick">
        <button class="btn small" data-place="top">Top</button>
        <button class="btn small" data-place="second">2nd from top</button>
        <button class="btn small" data-place="middle">Middle</button>
        <button class="btn small" data-place="random">Random</button>
        <button class="btn small" data-place="bottom">Bottom</button>
      </div>
      <label class="place-slider">
        <input id="place-range" type="range" min="0" value="0">
        <span id="place-readout"></span>
      </label>
      <button id="place-confirm" class="btn primary">Bury it</button>
    </div>
    <button id="modal-ok" class="btn primary" hidden>OK</button>
  </div>
</div>

<div id="toasts" class="toasts"></div>
<div id="conn-warning" class="conn-warning" hidden>Reconnecting…</div>

<script type="module" src="app.js"></script>
</body>
</html>
